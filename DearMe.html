<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Envelope Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Courier New", monospace;
    }

    body {
      background: linear-gradient(180deg, #fff0f6, #ffd6e7);
      min-height: 100vh;
      overflow-x: hidden;
      color: #ff4f9a;
    }

    .pixel-border {
      border: 4px solid #ff7db8;
      box-shadow:
        0 0 0 4px #fff,
        0 0 0 8px #ffb7d4;
    }

    .screen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      animation: fade 0.5s ease;
    }

    .active {
      display: flex;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-shadow: 3px 3px #fff;
      text-align: center;
    }

    p {
      text-align: center;
      line-height: 1.8;
    }

    .card {
      background: rgba(255,255,255,0.8);
      padding: 30px;
      border-radius: 10px;
      width: min(95%, 700px);
      backdrop-filter: blur(10px);
    }

    .characters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .character {
      background: #fff;
      padding: 15px;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
      border-radius: 12px;
      position: relative;
    }

    .character:hover {
      transform: translateY(-6px) scale(1.03);
      background: #ffe4f0;
    }

    .character.selected {
      background: #ffb7d4;
      color: white;
    }

    .avatar {
      width: 70px;
      height: 70px;
      margin: auto;
      margin-bottom: 12px;
      image-rendering: pixelated;
      position: relative;
    }

    .avatar::before {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      clip-path: polygon(
        20% 0%, 80% 0%,
        100% 20%, 100% 80%,
        80% 100%, 20% 100%,
        0% 80%, 0% 20%
      );
    }

    .pink { color: #ff6aa9; }
    .white { color: #fff; }
    .soft { color: #ff9ec5; }
    .berry { color: #ff3f8d; }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: #fff;
      color: #ff4f9a;
      font-size: 1rem;
    }

    button {
      margin-top: 25px;
      padding: 14px 30px;
      border: none;
      cursor: pointer;
      background: #ff5ca8;
      color: white;
      font-size: 1rem;
      border-radius: 10px;
      transition: 0.3s;
      box-shadow: 0 6px 0 #d93f82;
    }

    button:hover {
      transform: translateY(-3px);
    }

    .game-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .player-box {
      background: white;
      padding: 12px 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .energy {
      font-size: 1rem;
      background: #fff;
      padding: 12px 18px;
      border-radius: 12px;
    }

    .envelopes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 25px;
      width: 100%;
    }

    .envelope {
      aspect-ratio: 1/1;
      background: #fff;
      border-radius: 16px;
      cursor: pointer;
      position: relative;
      transition: 0.3s ease;
      overflow: hidden;
    }

    .envelope:hover {
      transform: translateY(-10px) rotate(-2deg);
    }

    .envelope::before {
      content: "💌";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }

    .opened {
      background: #ffe0ee;
      pointer-events: none;
    }

    .opened::before {
      content: "✨";
    }

    .popup {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .popup.active {
      display: flex;
      animation: fade 0.3s ease;
    }

    .popup-box {
      background: white;
      width: min(95%, 500px);
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      position: relative;
    }

    .popup h2 {
      margin-bottom: 15px;
      font-size: 2rem;
    }

    .popup-text {
      color: #ff4f9a;
      font-size: 1.1rem;
      line-height: 2;
      margin-bottom: 20px;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 10px;
      height: 10px;
      background: white;
      opacity: 0.7;
      animation: float 6s linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(100vh) rotate(0deg);
      }
      to {
        transform: translateY(-100px) rotate(360deg);
      }
    }

    .footer {
      margin-top: 30px;
      opacity: 0.7;
      text-align: center;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 2rem;
      }

      .popup-box {
        padding: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <section class="screen active" id="startScreen">
    <div class="card pixel-border">
      <h1>Pixel Letters ✨</h1>
      <p>
        افتحي الظروف واكتشفي الرسائل، الطاقة، والمفاجآت ✨<br>
        اختاري شخصيتك وابدئي رحلتك الوردية.
      </p>

      <input type="text" id="playerName" placeholder="اكتبي اسمك هنا...">

      <div class="characters">
        <div class="character pixel-border" data-char="Luna">
          <div class="avatar pink"></div>
          <h3>Luna</h3>
          <p>Dreamy Girl</p>
        </div>

        <div class="character pixel-border" data-char="Mika">
          <div class="avatar berry"></div>
          <h3>Mika</h3>
          <p>Chaos Energy</p>
        </div>

        <div class="character pixel-border" data-char="Yuki">
          <div class="avatar soft"></div>
          <h3>Yuki</h3>
          <p>Soft Soul</p>
        </div>

        <div class="character pixel-border" data-char="Nova">
          <div class="avatar pink"></div>
          <h3>Nova</h3>
          <p>Main Character</p>
        </div>
      </div>

      <button onclick="startGame()">ابدأ اللعبة</button>
    </div>
  </section>


  <section class="screen" id="gameScreen">
    <div class="card pixel-border">

      <div class="game-top">
        <div class="player-box pixel-border">
          <div class="avatar pink" id="playerAvatar"></div>
          <div>
            <h3 id="displayName">Player</h3>
            <small id="displayCharacter">Character</small>
          </div>
        </div>

        <div class="energy pixel-border">
          Energy: <span id="energy">0</span> ✨
        </div>
      </div>

      <div class="envelopes" id="envelopes"></div>

      <div class="footer">
        Created by Manar 💖
      </div>
    </div>
  </section>

 
  <div class="popup" id="popup">
    <div class="popup-box pixel-border">
      <h2>💖 Surprise</h2>
      <div class="popup-text" id="popupText"></div>
      <textarea id="journalBox" placeholder="اكتبي مشاعرك هنا... ✨" style="width:100%;min-height:120px;border:none;background:#fff5fa;padding:15px;border-radius:14px;resize:none;color:#ff4f9a;font-size:1rem;display:none;outline:none;"></textarea>
      <button onclick="closePopup()">إغلاق</button>
    </div>
  </div>

  <script>
    const characters = document.querySelectorAll('.character');
    const envelopesContainer = document.getElementById('envelopes');

    let selectedCharacter = null;
    let energy = 0;

    const messages = [
      'أنتِ أفضل مما تتوقعين ✨',
      'Take a deep breath 💖',
      'هذه إشارة لتبدئين من جديد 🌸',
      'كل شيء سيتحسن قريبًا 💌',
      'Your soft heart is your power 🌷',
      'تفريغ طاقة: اصرخي بدون صوت لمدة 5 ثواني 😭',
      'تفريغ طاقة: اكتبي أكثر شيء مزعجك ثم احذفيه ✨',
      'Energy Boost +10 💫',
      'اليوم أنتِ الشخصية الرئيسية 🎀',
      'مساحة تفريغ: اكتبي كل اللي بخاطرك هنا 💖',
      'رسالة سرية: شخص ما فخور بك جدًا 💖',
      'You survived every hard day so far 🌸',
      'Energy Boost +15 ⚡',
      'تفريغ طاقة: خذي نفسًا عميقًا واشربي ماء 💧'
    ];

    characters.forEach(char => {
      char.addEventListener('click', () => {
        characters.forEach(c => c.classList.remove('selected'));
        char.classList.add('selected');
        selectedCharacter = char.dataset.char;
      });
    });

    function startGame() {
      const name = document.getElementById('playerName').value.trim();

      if (!name || !selectedCharacter) {
        alert('اختاري شخصية واكتبي اسمك أولاً ✨');
        return;
      }

      document.getElementById('displayName').textContent = name;
      document.getElementById('displayCharacter').textContent = selectedCharacter;

      document.getElementById('startScreen').classList.remove('active');
      document.getElementById('gameScreen').classList.add('active');

      generateEnvelopes();
    }

    function generateEnvelopes() {
      for (let i = 0; i < 12; i++) {
        const envelope = document.createElement('div');
        envelope.className = 'envelope pixel-border';

        envelope.addEventListener('click', () => {
          if (envelope.classList.contains('opened')) return;

          envelope.classList.add('opened');

          const randomMessage = messages[Math.floor(Math.random() * messages.length)];

          if (randomMessage.includes('Boost')) {
            const points = parseInt(randomMessage.match(/\d+/)[0]);
            energy += points;
            document.getElementById('energy').textContent = energy;
          } else {
            energy += 3;
            document.getElementById('energy').textContent = energy;
          }

          showPopup(randomMessage);
        });

        envelopesContainer.appendChild(envelope);
      }
    }

    function showPopup(text) {
      document.getElementById('popupText').textContent = text;
      const journalBox = document.getElementById('journalBox');

      if (text.includes('اكتبي') || text.includes('تفريغ')) {
        journalBox.style.display = 'block';
      } else {
        journalBox.style.display = 'none';
      }

      document.getElementById('popup').classList.add('active');
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('active');
    }

   
    const stars = document.getElementById('stars');

    for (let i = 0; i < 35; i++) {
      const star = document.createElement('div');
      star.classList.add('star');

      star.style.left = Math.random() * 100 + 'vw';
      star.style.animationDuration = (Math.random() * 5 + 3) + 's';
      star.style.opacity = Math.random();
      star.style.transform = `scale(${Math.random() * 1.5})`;

      stars.appendChild(star);
    }
  </script>

</body>
</html>
